name: Web build

on:
  push:
    branches: [web]
  pull_request:
    branches: [web]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm install

      - name: Lint (syntax check)
        run: npm run lint

      - name: Smoke test server boot
        run: |
          AUTH_TOKEN=ci_test_token DB_PATH=./data/ci.db timeout 5 node src/server.js || code=$?; \
          if [ "${code:-0}" -ne 124 ]; then exit 1; fi
