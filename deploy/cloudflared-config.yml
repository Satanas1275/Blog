# Config cloudflared (Cloudflare Tunnel) — pas besoin d'ouvrir de port sur le RPi,
# pas besoin de nginx : le tunnel fait le reverse proxy directement.
#
# Setup (une fois) :
#   cloudflared tunnel login
#   cloudflared tunnel create bastian-riot-blog
#   cloudflared tunnel route dns bastian-riot-blog bastian-riot.rocknite-studio.com
#   sudo cp config.yml /etc/cloudflared/config.yml   # ce fichier, en adaptant credentials-file
#   sudo cloudflared service install
#   sudo systemctl enable --now cloudflared

tunnel: bastian-riot-blog
credentials-file: /root/.cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: bastian-riot.rocknite-studio.com
    service: http://localhost:3003
  - service: http_status:404
